services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      # Purga del historial de ejecuciones. n8n guarda el payload íntegro de cada
      # nodo, y en este pipeline eso son cientos de artículos con embeddings de
      # 1024 dimensiones: ~1,3 MB por ejecución de las fases 01-04. Con el tope
      # por defecto (10.000 ejecuciones) la tabla execution_data llegaría a ~13 GB
      # antes de que n8n limpiara nada; medido, alcanzó 1,2 GB en dos días.
      # Se conserva historial suficiente para depurar una corrida (una diaria son
      # ~20 ejecuciones) sin que crezca sin límite.
      #
      # Ojo: la purga borra filas, pero Postgres no devuelve el espacio al sistema
      # operativo — lo marca como reutilizable y el fichero sigue igual de grande.
      # Medido tras activarla: 300 filas con 377 MB de datos reales ocupando
      # 1.251 MB. Recuperarlo es manual y bloquea la tabla unos segundos:
      #   docker exec <postgres> psql -U $POSTGRES_USER -d $POSTGRES_DB \
      #     -c "VACUUM (FULL, ANALYZE) execution_data;"
      # Hace falta una sola vez, al activar la purga; después el tope mantiene el
      # tamaño estable y el autovacuum normal basta.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168      # horas (7 días)
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 300
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
  
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  n8n_data:
  ollama_data: